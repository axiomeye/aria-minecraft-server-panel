name: deploy cloud run infrastructure

on:
  workflow_dispatch:

concurrency:
  group: deploy-cr-infra
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: "Terraform Cloud Run"
    runs-on: ubuntu-24.04
    environment: reflected-gamma-341201

    env:
      TF_VAR_region: ${{ vars.REGION }}
      TF_VAR_project_id: reflected-gamma-341201
      TF_VAR_zone: ${{ vars.ZONE }}
      TF_VAR_instance_name: ${{ vars.INSTANCE_NAME }}
      TF_VAR_gh_app_id: ${{ secrets.GH_APP_ID }}
      TF_VAR_gh_app_installation_id: ${{ secrets.GH_APP_INSTALLATION_ID }}
      TF_VAR_gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      TF_VAR_iap_group_email: ${{ vars.IAP_GROUP_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform Init
        working-directory: ./terraform/cloud-run
        run: |
          terraform init -upgrade \
            -backend-config="bucket=${{ secrets.GCP_BUCKET }}" \
            -backend-config="prefix=terraform-states/cr"

      - name: Terraform Apply
        working-directory: ./terraform/cloud-run
        run: terraform apply -auto-approve
