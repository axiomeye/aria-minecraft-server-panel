<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Required — AriA Server</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #07111f;
      color: #c8cfe0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(80, 160, 255, 0.18) 0%, rgba(30, 90, 180, 0.07) 50%, transparent 75%);
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(99, 130, 190, 0.13);
      border-radius: 18px;
      padding: 2.5rem 2.25rem 2rem;
      width: 360px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      background: linear-gradient(135deg, #7eb3ff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.75rem;
    }

    .icon {
      font-size: 2.2rem;
      margin-bottom: 0.9rem;
      line-height: 1;
    }

    h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 0.6rem;
    }

    p {
      font-size: 0.83rem;
      color: #7a8fac;
      line-height: 1.65;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      padding: 0.6rem 1.6rem;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <h1>AriA</h1>
    <div class="icon">🔒</div>
    <h2>Access Required</h2>
    <p>You need to be a member of the AriA group to access this page. Request access below and you'll be added by an admin.</p>
    <a class="btn" href="https://groups.google.com/g/aria-minecraft-server" target="_blank" rel="noopener">Request Access</a>
  </div>
</body>
</html>
